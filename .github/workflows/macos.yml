name: macOS build

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel compile jobs
        default: '6'
      version:
        description: Rail release version (empty for a development build)
        default: ''

permissions:
  contents: read

concurrency:
  group: rail-macos
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, rail-macos]
    timeout-minutes: 900
    outputs:
      assets: ${{ steps.package.outputs.assets }}
    steps:
      - name: Sync shared checkout
        shell: bash
        env:
          RAIL_REPO_DIR: /Users/Shared/rail/build/rail-browser
          RAIL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RAIL_REPO_DIR"
          git diff --quiet
          git diff --cached --quiet
          test -f build/src/BUILD.gn
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          git -c fetch.unpackLimit=1 fetch -q --no-tags "$remote" "$GITHUB_SHA"
          target="$GITHUB_SHA"
          if [[ -n "$RAIL_VERSION" ]]; then
            [[ "$RAIL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git -c fetch.unpackLimit=1 fetch -q --no-tags "$remote" "refs/tags/v$RAIL_VERSION"
            target="$(git rev-parse "FETCH_HEAD^{commit}")"
            git merge-base --is-ancestor "$target" "$GITHUB_SHA"
          fi
          applied="$(git rev-parse HEAD)"
          if ! git diff --quiet "$applied" "$target" -- ungoogled-chromium patches \
              ':(exclude)patches/rail-shell.patch'; then
            echo "::error::patch layers below rail-shell.patch changed since $applied; prepare a fresh tree"
            exit 1
          fi
          previous="$RUNNER_TEMP/applied-rail-shell.patch"
          git show "$applied:patches/rail-shell.patch" > "$previous"
          git checkout -q --detach "$target"
          if ! .venv/bin/python platform/update_rail_patch.py --tree build/src \
              --previous "$previous" --current patches/rail-shell.patch; then
            git checkout -q --detach "$applied"
            exit 1
          fi
          git -C build/src apply --reverse --check "$RAIL_REPO_DIR/patches/rail-shell.patch"
      - name: Verify release branding
        if: inputs.version != ''
        shell: bash
        env:
          RAIL_REPO_DIR: /Users/Shared/rail/build/rail-browser
        run: |
          set -euo pipefail
          grep -qx 'MAC_BUNDLE_ID=com.frenvius.rail' \
            "$RAIL_REPO_DIR/build/src/chrome/app/theme/chromium/BRANDING"
      - name: Build Rail
        if: inputs.version == ''
        shell: bash
        env:
          RAIL_REPO_DIR: /Users/Shared/rail/build/rail-browser
          BUILD_JOBS: ${{ inputs.jobs }}
        run: |
          cd "$RAIL_REPO_DIR"
          .venv/bin/python platform/macos/build.py --regenerate -j "$BUILD_JOBS"
      - name: Build release
        if: inputs.version != ''
        shell: bash
        env:
          RAIL_REPO_DIR: /Users/Shared/rail/build/rail-browser
          BUILD_JOBS: ${{ inputs.jobs }}
          RAIL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RAIL_REPO_DIR"
          .venv/bin/python platform/macos/build.py --release --regenerate \
            --rail-version "$RAIL_VERSION" --target chrome \
            --target chrome/installer/mac:mac -j "$BUILD_JOBS"
      - name: Package ad hoc release
        if: inputs.version != ''
        id: package
        shell: bash
        env:
          RAIL_REPO_DIR: /Users/Shared/rail/build/rail-browser
          RAIL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd "$RAIL_REPO_DIR"
          .venv/bin/python platform/macos/package.py --version "$RAIL_VERSION" \
            --repository "$GITHUB_REPOSITORY"
          echo "assets=$RAIL_REPO_DIR/build/release/mac/$RAIL_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    if: inputs.version != ''
    needs: build
    runs-on: [self-hosted, rail-macos]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Attach macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RAIL_VERSION: ${{ inputs.version }}
          RAIL_ASSETS: ${{ needs.build.outputs.assets }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          test -f "$RAIL_ASSETS/Rail-$RAIL_VERSION-macos-arm64.dmg"
          test -f "$RAIL_ASSETS/macos-appcast.xml"
          test -f "$RAIL_ASSETS/INSTALL-macOS.txt"
          test -f "$RAIL_ASSETS/SHA256SUMS-macos"
          gh release view "v$RAIL_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          source_archive=("$RAIL_ASSETS"/uBlock-*-source.tar.gz)
          test -f "${source_archive[0]}"
          gh release view "v$RAIL_VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -qx "$(basename "${source_archive[0]}")"
          gh release upload "v$RAIL_VERSION" \
            "$RAIL_ASSETS/Rail-$RAIL_VERSION-macos-arm64.dmg" \
            "$RAIL_ASSETS/macos-appcast.xml" \
            "$RAIL_ASSETS/INSTALL-macOS.txt" \
            "$RAIL_ASSETS/SHA256SUMS-macos" \
            --repo "$GITHUB_REPOSITORY"
